<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Tracker - Add Resident</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class='bx bx-cube-alt logo-icon'></i>
                <span class="nav-label-main">Navigation</span>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><i class='bx bx-home-alt-2'></i> Home</a>
                <a href="add-resident.html" class="menu-item active"><i class='bx bx-plus-circle'></i> ADD</a>
                <a href="#" class="menu-item"><i class='bx bx-file'></i> Report Related</a>
                <a href="accounts.html" class="menu-item active"><i class='bx bx-user-account'></i> Accounts</a>
                <a href="#" class="menu-item"><i class='bx bx-cog'></i> Settings</a>
                <a href="#" class="menu-item"><i class='bx bx-help-circle'></i> Help</a>
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="menu-item logout-btn"><i class='bx bx-log-out'></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2>Resident's Profile Add (Editor/Admin)</h2>
                <div class="user-badge">Editor Mode</div>
            </header>
            
            <div class="content-body">
                <form action="/add-resident" method="POST" class="form-container">
                    
                    <div class="form-inputs-block">
                        
                        <div class="form-row-full">
                            <label for="full-name">Name</label>
                            <input type="text" id="full-name" name="full_name" required placeholder="Last Name, First Name, Middle Name">
                        </div>

                        <div class="form-grid-three">
                            <div class="form-group">
                                <label for="age">Age</label>
                                <input type="number" id="age" name="age" required min="0">
                            </div>
                            <div class="form-group">
                                <label for="sex">Sex</label>
                                <select id="sex" name="sex" required>
                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="status">Status</label>
                                <input type="text" id="status" name="status" placeholder="Single, Married, etc.">
                            </div>
                        </div>

                        <div class="form-row-full">
                            <label for="birth-date">Date of Birth</label>
                            <input type="date" id="birth-date" name="birth_date" required>
                        </div>

                        <div class="form-row-full">
                            <label for="birth-place">Birth Place</label>
                            <input type="text" id="birth-place" name="birth_place" required>
                        </div>

                        <div class="form-row-full">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" required placeholder="House No., Street, Purok/Zone">
                        </div>

                        <div class="form-row-full">
                            <label for="other-infos">Other Infos included in the proposal</label>
                            <textarea id="other-infos" name="other_infos" rows="4" placeholder="Type additional household remarks here..."></textarea>
                        </div>
                        
                    </div>

                    <div class="form-actions-block">
                        <div class="image-uploader-card">
                            <div class="image-preview-placeholder">
                                <i class='bx bx-user-circle'></i>
                                <span>Picture (UC)</span>
                            </div>
                            <input type="file" id="profile-pic" name="profile_pic" accept="image/*" class="file-input-hidden">
                            <label for="profile-pic" class="btn-upload">Upload Photo</label>
                        </div>

                        <div class="form-buttons-group">
                            <a href="dashboard.html" class="btn-form btn-cancel">Cancel</a>
                            <button type="submit" class="btn-form btn-save"><i class='bx bx-save'></i> Save</button>
                        </div>
                    </div>

                </form>
            </div>
        </main>

    </div>

</body>
</html>
