<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Tracker - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h1>Barangay Residents and Population Tracker</h1>
        
        <div class="login-card">
            <form action="dashboard.html" method="GET">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>

        <p class="footer-text">
            About website texts About website texts About website texts About website texts About website texts About website texts About website texts About website texts About website texts About website texts 
        </p>
    </div>

</body>
</html>
