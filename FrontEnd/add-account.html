<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Tracker - Create Account</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class='bx bx-cube-alt logo-icon'></i>
                <span class="nav-label-main">Navigation</span>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><i class='bx bx-home-alt-2'></i> Home</a>
                <a href="add-resident.html" class="menu-item"><i class='bx bx-plus-circle'></i> ADD</a>
                <a href="#" class="menu-item"><i class='bx bx-file'></i> Report Related</a>
                <a href="accounts.html" class="menu-item active"><i class='bx bx-user-account'></i> Accounts</a>
                <a href="#" class="menu-item"><i class='bx bx-cog'></i> Settings</a>
                <a href="#" class="menu-item"><i class='bx bx-help-circle'></i> Help</a>
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="menu-item logout-btn"><i class='bx bx-log-out'></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2>Account (Admin)</h2>
                <div class="user-badge">System Administrator</div>
            </header>
            
            <div class="content-body">
                <div class="account-card-container">
                    <form action="/create-account" method="POST" class="account-form">
                        
                        <div class="form-row-split">
                            <div class="form-group flex-3">
                                <label for="full-name">Full name</label>
                                <input type="text" id="full-name" name="full_name" required>
                            </div>
                            <div class="form-group flex-1">
                                <label for="sex">Sex</label>
                                <select id="sex" name="sex" required>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row-full margin-top-sm">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required autocomplete="off">
                        </div>

                        <div class="form-row-full margin-top-sm">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div class="form-row-full margin-top-sm">
                            <label for="access-level">Access Level <span class="sub-label">(Susceptible to change)</span></label>
                            <select id="access-level" name="access_level" class="accent-select" required>
                                <option value="Viewer">Viewer</option>
                                <option value="Editor">Editor</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>

                        <div class="form-buttons-group margin-top-lg">
                            <a href="accounts.html" class="btn-form btn-cancel">Cancel</a>
                            <button type="button" class="btn-form btn-delete">Delete</button>
                            <button type="submit" class="btn-form btn-save">Edit</button>
                        </div>

                    </form>
                </div>
            </div>
        </main>

    </div>

</body>
</html>
